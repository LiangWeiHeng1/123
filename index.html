<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>澳门六合彩直播</title>
  <style>
    body { background:#111; color:#eee; font-family:sans-serif; margin:0; padding:16px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .tab { padding:8px 12px; background:#333; border-radius:6px; cursor:pointer; user-select:none; font-size:14px; }
    .tab.active { background:#1a3d96; }
    #player { width:100%; max-width:960px; aspect-ratio:16/9; background:#000; border-radius:8px; }
    #iframeBox { display:none; width:100%; max-width:960px; aspect-ratio:16/9; background:#000; border-radius:8px; }
    #iframeBox iframe { width:100%; height:100%; border:0; }
    #status { margin-top:8px; font-size:13px; color:#aaa; word-break: break-all; }
  </style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <video id="player" controls muted playsinline webkit-playsinline></video>
  <div id="iframeBox"><iframe allow="autoplay" allowfullscreen></iframe></div>
  <div id="status">等待选择线路…</div>

  <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>

  <script>
    // 你的 Cloudflare Worker 代理地址
    const PROXY = "https://jisuanqi.740550267.workers.dev/?url=";

    // 判断是否为手机端（安卓/苹果都算）
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const lineList = [
      {
        title: "線路一",
        urls: [{ url: "https://play3833366.is-spec.com/live/mosixmark.flv,https://play8888.88888lhc.com/live/mosixmark.flv,https://play666.macau-lhc.live/live/mosixmark.flv,https://live-macaujc.com/live/livestream/new.flv", key: "flv" }]
      },
      {
        title: "線路二",
        urls: [{ url: "https://play8882.ksrd365.com/live/mosixmark.flv", key: "flv" }]
      },
      {
        title: "線路三",
        urls: [{ url: "https://play8398.lianwin88.com/live/mosixmark.flv", key: "flv" }]
      },
      {
        title: "全局 FLV",
        urls: [{ url: "https://play666.macau-lhc.live/live/mosixmark.flv", key: "flv" }]
      },
      {
        title: "全局 M3U8",
        urls: [{ url: "https://live-macaujc.com/live/livestream/new.m3u8", key: "m3u8" }]
      },
      {
        title: "動畫直播",
        urls: [
          { url: "https://video.api-macaujc.com/macau", key: "game", platform: "mobile" },
          { url: "https://video.api-macaujc.com/macau", key: "game", platform: "pc" }
        ],
        type: "game"
      }
    ];

    const videoEl = document.getElementById('player');
    const iframeBox = document.getElementById('iframeBox');
    const iframeEl = iframeBox.querySelector('iframe');
    const statusEl = document.getElementById('status');
    const tabsEl = document.getElementById('tabs');
    
    let flvPlayer = null;
    let hlsPlayer = null;

    function setStatus(msg, color='#aaa') { statusEl.textContent = msg; statusEl.style.color = color; }

    function destroyPlayers() {
      if (flvPlayer) { try { flvPlayer.pause(); flvPlayer.unload(); flvPlayer.detachMediaElement(); flvPlayer.destroy(); } catch(e){} flvPlayer = null; }
      if (hlsPlayer) { try { hlsPlayer.destroy(); } catch(e){} hlsPlayer = null; }
      videoEl.removeAttribute('src');
      videoEl.load();
    }

    function clearIframe() {
      iframeBox.style.display = 'none';
      iframeEl.src = 'about:blank';
    }

    function playStream(type, urls) {
      destroyPlayers();
      clearIframe();
      videoEl.style.display = 'block';
      iframeBox.style.display = 'none';

      let rawUrls = urls.join(',').split(',').map(s => s.trim()).filter(Boolean);
      
      // 【核心逻辑】如果是手机，且地址里有 .flv，强行把扩展名改成 .m3u8，走 HLS 播放！
      if (isMobile && !type.includes('m3u8')) {
        rawUrls = rawUrls.map(u => u.replace('.flv', '.m3u8'));
        type = 'm3u8';
        setStatus('检测到手机端，已自动转换为 M3U8 格式…', '#2979ff');
      }

      const isM3u8 = type === 'm3u8' || rawUrls[0].includes('.m3u8');
      const candidates = rawUrls.map(u => PROXY + encodeURIComponent(u));

      let idx = 0;
      function tryNext() {
        if (idx >= candidates.length) {
          setStatus('所有地址都尝试失败，可能是当前未开播。', '#ff5252');
          return;
        }
        const url = candidates[idx++];
        setStatus('尝试加载 ' + (isM3u8 ? 'M3U8' : 'FLV') + ' 第 ' + idx + ' 个地址…', '#ff9800');

        if (isM3u8) {
          // --- HLS 播放 (兼容苹果和安卓) ---
          if (Hls.isSupported()) {
            hlsPlayer = new Hls({ maxLoadingDelay: 1 });
            hlsPlayer.loadSource(url);
            hlsPlayer.attachMedia(videoEl);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => { videoEl.play().catch(()=>{}); });
            hlsPlayer.on(Hls.Events.ERROR, (evt, data) => {
              if (data.fatal) { setStatus('M3U8 失败，尝试下一个…', '#ff9800'); tryNext(); }
            });
          } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            // 苹果 Safari 原生支持
            videoEl.src = url;
            videoEl.play().catch(()=>{});
          } else {
            setStatus('当前浏览器不支持 M3U8', '#ff5252');
          }
        } else {
          // --- FLV 播放 (主要在电脑端执行) ---
          if (!flvjs.isSupported()) {
            setStatus('您的浏览器不支持 FLV，请切换其他线路', '#ff5252');
            return;
          }
          flvPlayer = flvjs.createPlayer({ type:'flv', url, isLive:true });
          flvPlayer.attachMediaElement(videoEl);
          flvPlayer.load();
          flvPlayer.play().catch(()=>{});
          flvPlayer.on('error', () => { setStatus('FLV 失败，尝试下一个…', '#ff9800'); tryNext(); });
        }
      }
      tryNext();
    }

    function playGame(urls) {
      destroyPlayers();
      videoEl.style.display = 'none';
      iframeBox.style.display = 'block';
      const item = urls.find(u => u.platform === (isMobile ? 'mobile' : 'pc')) || urls[0];
      iframeEl.src = item.url;
      setStatus('动画直播已加载', '#00c853');
    }

    function playLine(item) {
      if (!item.urls || !item.urls.length) return;
      const first = item.urls[0];
      if (first.key === 'game' || item.type === 'game') {
        playGame(item.urls);
      } else {
        playStream(first.key, item.urls.map(u => u.url));
      }
    }

    lineList.forEach((item, i) => {
      const btn = document.createElement('div');
      btn.className = 'tab' + (i === 0 ? ' active' : '');
      btn.textContent = item.title;
      btn.onclick = () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        playLine(item);
      };
      tabsEl.appendChild(btn);
    });
  </script>
</body>
</html>
